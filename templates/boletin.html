<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Boletín — PlanHoras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0d1117;
            --cream: #f8f4ee;
            --gold: #b8922a;
            --gold-light: #e8d5a3;
            --teal: #1a4a4a;
            --teal-light: #2d7070;
            --mist: #e4dfd6;
            --paper: #fdfaf5;
            --rust: #8b3a1e;
            --success: #1a4a4a;
            --warn: #8b3a1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 40% at 10% 85%, rgba(184,146,42,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 40% 50% at 90% 10%, rgba(26,74,74,0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2.5rem;
            border-bottom: 1px solid var(--mist);
            background: rgba(248,244,238,0.92);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: 1.4rem;
            text-decoration: none;
            color: var(--ink);
        }
        .logo span { color: var(--gold); }

        .nav-actions { display: flex; gap: 0.6rem; }

        .btn {
            padding: 0.5rem 1.1rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--ink);
            background: transparent;
            color: var(--ink);
            transition: all 0.2s;
        }
        .btn:hover { background: var(--ink); color: var(--cream); }
        .btn.primary { background: var(--teal); color: white; border-color: var(--teal); }
        .btn.primary:hover { background: var(--teal-light); border-color: var(--teal-light); }
        .btn.gold { background: var(--gold); color: white; border-color: var(--gold); }
        .btn.gold:hover { background: #a07820; border-color: #a07820; }

        .main-layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 440px;
            min-height: calc(100vh - 58px);
        }

        .form-panel {
            padding: 2.5rem 3rem;
            border-right: 1px solid var(--mist);
            overflow-y: auto;
        }

        .panel-header { margin-bottom: 2.5rem; }

        .eyebrow {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .eyebrow::before {
            content: '';
            width: 1.5rem;
            height: 1.5px;
            background: var(--gold);
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .form-section { margin-bottom: 2.5rem; }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--mist);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .section-title .num {
            width: 22px;
            height: 22px;
            background: var(--teal);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            flex-shrink: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .form-grid.full { grid-template-columns: 1fr; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .field.span-2 { grid-column: span 2; }

        label {
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #777;
        }

        input, select, textarea {
            font-family: 'Outfit', sans-serif;
            font-size: 0.88rem;
            padding: 0.65rem 0.85rem;
            background: var(--paper);
            border: 1px solid var(--mist);
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(26,74,74,0.08);
        }
        textarea { resize: vertical; min-height: 75px; }

        .periods-config {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1rem 1.2rem;
            background: var(--paper);
            border: 1px solid var(--mist);
            margin-bottom: 1.2rem;
        }
        .periods-config label { font-size: 0.75rem; white-space: nowrap; margin-bottom: 0; letter-spacing: 0.05em; text-transform: none; color: var(--ink); font-weight: 400; }
        .period-count-input { width: 70px; text-align: center; font-size: 1rem; font-weight: 600; padding: 0.4rem 0.5rem; }

        .period-names-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }
        .period-name-field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            min-width: 100px;
        }
        .period-name-field label { font-size: 0.6rem; color: var(--teal); }
        .period-name-field input { padding: 0.4rem 0.6rem; font-size: 0.78rem; border-color: rgba(26,74,74,0.25); width: 100%; }

        .subjects-toolbar { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
        .table-scroll { overflow-x: auto; }

        table.subjects-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }
        .subjects-table thead tr { background: var(--teal); }
        .subjects-table thead th {
            color: white;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.6rem 0.7rem;
            text-align: left;
            white-space: nowrap;
        }
        .subjects-table thead th.period-th { text-align: center; background: var(--teal-light); min-width: 75px; }
        .subjects-table thead th.prom-th { text-align: center; background: var(--gold); color: var(--ink); min-width: 70px; }
        .subjects-table tbody tr { border-bottom: 1px solid var(--mist); transition: background 0.15s; }
        .subjects-table tbody tr:hover { background: rgba(26,74,74,0.03); }
        .subjects-table tbody tr:nth-child(even) { background: rgba(253,250,245,0.7); }
        .subjects-table tbody tr:nth-child(even):hover { background: rgba(26,74,74,0.04); }
        .subjects-table td { padding: 0.4rem 0.5rem; vertical-align: middle; }
        .td-num { color: #ccc; font-size: 0.7rem; text-align: center; width: 28px; }
        .subjects-table td input { border: 1px solid transparent; background: transparent; padding: 0.35rem 0.5rem; font-size: 0.82rem; }
        .subjects-table td input:focus { background: white; border-color: var(--teal); }
        .hours-input { text-align: center; width: 70px; font-weight: 500; }
        .prom-cell { text-align: center; font-weight: 700; font-size: 0.85rem; color: var(--teal); background: rgba(184,146,42,0.08); padding: 0.4rem 0.7rem; }

        .btn-delete {
            width: 22px; height: 22px;
            background: none; border: 1px solid #ddd; color: #aaa;
            cursor: pointer; font-size: 0.7rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .btn-delete:hover { background: var(--rust); border-color: var(--rust); color: white; }

        .subjects-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 0;
            margin-top: 0.5rem;
            border-top: 1.5px solid var(--ink);
        }
        .total-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #666; }
        .total-prom { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 700; color: var(--teal); }

        /* PREVIEW PANEL */
        .preview-panel {
            background: var(--paper);
            overflow-y: auto;
            position: sticky;
            top: 58px;
            height: calc(100vh - 58px);
        }
        .preview-header {
            padding: 1.5rem 1.5rem 1rem;
            border-bottom: 1px solid var(--mist);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .preview-title { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #888; }
        .live-dot { width: 7px; height: 7px; background: #2ecc71; border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
        .preview-content { padding: 1.5rem; }

        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; gap: 1rem; color: #bbb; }
        .empty-state .icon { font-size: 2.5rem; opacity: 0.4; }
        .empty-state p { font-size: 0.82rem; text-align: center; line-height: 1.6; }

        .doc-sheet { background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.1); font-size: 0.72rem; overflow: hidden; }
        .doc-sheet-header { background: var(--teal); color: white; padding: 1rem 1.2rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
        .doc-inst { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 700; }
        .doc-period { font-size: 0.6rem; opacity: 0.6; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.2rem; }
        .doc-badge { background: var(--gold); color: var(--ink); padding: 0.25rem 0.6rem; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
        .doc-prog-strip { background: var(--gold-light); padding: 0.5rem 1.2rem; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); }
        .doc-sheet-body { padding: 1rem 1.2rem; }
        .doc-meta { display: flex; gap: 1.5rem; margin-bottom: 0.8rem; }
        .doc-meta-item { display: flex; flex-direction: column; gap: 0.15rem; }
        .doc-meta-item label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.12em; color: #aaa; font-weight: 500; }
        .doc-meta-item .val { font-size: 0.78rem; font-weight: 500; }
        .doc-divider { height: 1px; background: var(--mist); margin: 0.7rem 0; }

        .preview-table { width: 100%; border-collapse: collapse; font-size: 0.68rem; }
        .preview-table thead th { background: var(--teal); color: white; padding: 0.4rem 0.5rem; text-align: left; font-weight: 500; letter-spacing: 0.06em; font-size: 0.6rem; }
        .preview-table thead th.period-col { text-align: center; background: var(--teal-light); }
        .preview-table thead th.prom-col { text-align: center; background: var(--gold); color: var(--ink); }
        .preview-table tbody tr { border-bottom: 1px solid #f0ede8; }
        .preview-table tbody tr:nth-child(even) { background: #fdfaf5; }
        .preview-table td { padding: 0.35rem 0.5rem; }
        .preview-table td.p-center { text-align: center; color: #555; }
        .preview-table td.p-prom { text-align: center; font-weight: 700; color: var(--teal); background: rgba(184,146,42,0.07); }

        .doc-total-row { display: flex; justify-content: space-between; align-items: center; background: var(--ink); color: white; padding: 0.6rem 0.8rem; margin-top: 0.8rem; }
        .doc-total-label { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }
        .doc-total-val { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 700; color: var(--gold-light); }

        .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: var(--cream); padding: 0.75rem 1.5rem; font-size: 0.82rem; font-weight: 500; z-index: 9999; transition: transform 0.3s ease; pointer-events: none; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.warning { background: var(--rust); }

        .nav-logo-container {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .preview-panel { display: none; }
            .form-panel { padding: 1.5rem; }
            nav { padding: 1rem 1.5rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">Plan<span>Horas</span></a>
        <div style="display: flex; gap: 1.5rem; align-items: center;">
            <div class="nav-actions">
                <button class="btn" onclick="resetForm()">Limpiar</button>
                <button class="btn gold" onclick="loadDefaults()">Cargar ejemplo</button>
                <button class="btn primary" onclick="imprimirBoletin()">🖨 Imprimir / PDF</button>
            </div>
            <div class="nav-logo-container">
                <img src="/static/logo.png" alt="Colegio Gonzalo Rivera Laguado">
            </div>
        </div>
    </nav>

    <div class="main-layout">
        <div class="form-panel">
            <div class="panel-header">
                <div class="eyebrow">Nuevo Boletín</div>
                <h1>Control de Horas<br>por Asignatura</h1>
            </div>

            <div class="form-section">
                <div class="section-title"><span class="num">1</span> Datos del Docente</div>
                <div class="form-grid">
                    <div class="field span-2">
                        <label>Nombre Completo del Docente</label>
                        <input type="text" id="docente" placeholder="Ej. Juan Carlos García Martínez" oninput="updatePreview()">
                    </div>
                    <div class="field">
                        <label>Titular</label>
                        <input type="text" id="titular" placeholder="Ej. 10-01" oninput="updatePreview()">
                    </div>
                    <div class="field">
                        <label>Tipo de Docente</label>
                        <select id="tipo_docente" oninput="updatePreview()">
                            <option value="">Seleccionar...</option>
                            <option value="Titular">Titular</option>
                            <option value="Pasante">Pasante</option>
                            <option value="Docente Técnico">Docente Técnico</option>
                            <option value="Doble Jornada">Docente AM/PM</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title"><span class="num">2</span> Registro de Asignaturas</div>
                <div class="subjects-toolbar">
                    <button class="btn" onclick="addSubject()">+ Añadir asignatura</button>
                </div>
                <div class="table-scroll">
                    <table class="subjects-table">
                        <thead>
                            <tr id="table-head-row">
                                <th style="width:28px">#</th>
                                <th style="min-width:150px">Asignatura</th>
                                <th style="min-width:120px">Grado y Curso</th>
                                <th style="min-width:100px">Intensidad Semanal</th>
                                <th style="width:30px"></th>
                            </tr>
                        </thead>
                        <tbody id="subjects-body"></tbody>
                    </table>
                </div>
                <div class="subjects-footer">
                    <span class="total-label">Total Docente</span>
                    <span class="total-prom" id="total-horas">— h</span>
                </div>
            </div>
        </div>

        <div class="preview-panel">
            <div class="preview-header">
                <span class="preview-title">Vista previa en tiempo real</span>
                <div class="live-dot"></div>
            </div>
            <div class="preview-content">
                <div id="doc-preview">
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <p>Completa los datos del formulario<br>para ver la vista previa aquí</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let subjects = [];
        let subjectCounter = 0;

        function init() {
            addSubject();
            addSubject();
            addSubject();
        }

        function addSubject() {
            subjects.push({
                id: ++subjectCounter,
                nombre: '',
                grado_curso: '',
                intensidad: ''
            });
            renderSubjectsTable();
            updatePreview();
        }

        function removeSubject(id) {
            subjects = subjects.filter(s => s.id !== id);
            renderSubjectsTable();
            updatePreview();
        }

        function renderSubjectsTable() {
            const tbody = document.getElementById('subjects-body');
            tbody.innerHTML = '';
            subjects.forEach((s, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="td-num">${idx + 1}</td>
                    <td>
                        <input type="text" placeholder="Nombre de la asignatura"
                               value="${s.nombre}"
                               oninput="updateSubject(${s.id}, 'nombre', this.value)"
                               style="min-width:130px;">
                    </td>
                    <td>
                        <input type="text" placeholder="Ej. 9-01"
                               value="${s.grado_curso}"
                               oninput="updateSubject(${s.id}, 'grado_curso', this.value)"
                               style="min-width:100px;">
                    </td>
                    <td>
                        <input type="number" placeholder="0" value="${s.intensidad}" min="0" max="9999"
                               class="hours-input"
                               oninput="updateSubject(${s.id}, 'intensidad', this.value)"
                               style="min-width:80px;text-align:center;">
                    </td>
                    <td><button class="btn-delete" onclick="removeSubject(${s.id})" title="Eliminar">✕</button></td>
                `;
                tbody.appendChild(tr);
            });
            updateTotalHoras();
        }

        function updateSubject(id, field, value) {
            const s = subjects.find(s => s.id === id);
            if (s) { 
                s[field] = value; 
                updateTotalHoras();
                updatePreview(); 
            }
        }

        function updateTotalHoras() {
            const total = subjects.reduce((sum, s) => {
                const intensidad = parseInt(s.intensidad) || 0;
                return sum + intensidad;
            }, 0);
            const el = document.getElementById('total-horas');
            el.textContent = total > 0 ? total + ' h' : '— h';
        }

        function getFormData() {
            const asignaturas = subjects
                .filter(s => s.nombre.trim())
                .map(s => ({
                    nombre: s.nombre,
                    grado_curso: s.grado_curso,
                    intensidad: parseInt(s.intensidad) || 0
                }));
            
            const totalHoras = asignaturas.reduce((sum, a) => sum + a.intensidad, 0);

            return {
                docente: document.getElementById('docente').value,
                titular: document.getElementById('titular').value,
                tipo_docente: document.getElementById('tipo_docente').value,
                asignaturas: asignaturas,
                total_horas: totalHoras
            };
        }

        function updatePreview() {
            const data = getFormData();
            const container = document.getElementById('doc-preview');

            if (!data.docente && data.asignaturas.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <p>Completa los datos del formulario<br>para ver la vista previa aquí</p>
                    </div>`;
                return;
            }

            const subjectsRows = data.asignaturas.length > 0
                ? data.asignaturas.map(s => {
                    return `<tr>
                        <td>${s.nombre || '—'}</td>
                        <td style="font-size:0.6rem;color:#777;">${s.grado_curso || '—'}</td>
                        <td style="text-align:center;font-weight:600;color:#1a4a4a;">${s.intensidad}h</td>
                    </tr>`;
                }).join('')
                : `<tr><td colspan="3" style="text-align:center;color:#bbb;padding:1rem;font-size:0.72rem;">Sin asignaturas añadidas</td></tr>`;

            const today = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' });

            container.innerHTML = `
                <div class="doc-sheet">
                    <div class="doc-sheet-header">
                        <div>
                            <div class="doc-inst">DISTRIBUCIÓN DE CARGA ACADÉMICA</div>
                            <div class="doc-period">Jornada de la Tarde</div>
                        </div>
                    </div>
                    <div class="doc-prog-strip">${data.docente.toUpperCase() || 'DOCENTE'}</div>
                    <div class="doc-sheet-body">
                        <div class="doc-meta">
                            ${data.tipo_docente ? `<div class="doc-meta-item"><label>Tipo</label><div class="val">${data.tipo_docente}${data.titular ? ' • ' + data.titular : ''}</div></div>` : ''}
                            <div class="doc-meta-item" style="margin-left:auto;"><label>Generado</label><div class="val">${today}</div></div>
                        </div>
                        <div class="doc-divider"></div>
                        <table class="preview-table">
                            <thead>
                                <tr>
                                    <th>Asignatura</th>
                                    <th>Grado y Curso</th>
                                    <th class="prom-col">Intensidad</th>
                                </tr>
                            </thead>
                            <tbody>${subjectsRows}</tbody>
                        </table>
                        <div class="doc-total-row">
                            <span class="doc-total-label">Total Docente</span>
                            <span class="doc-total-val">${data.total_horas}h</span>
                        </div>
                    </div>
                </div>`;
        }

        function loadDefaults() {
            document.getElementById('docente').value = 'Juan Carlos García Martínez';
            document.getElementById('titular').value = '10-01';
            document.getElementById('tipo_docente').value = 'Titular';
            subjects = [];
            subjectCounter = 0;
            const defaults = [
                { nombre: 'Matemáticas', grado_curso: '9-01', intensidad: '4' },
                { nombre: 'Lengua Española', grado_curso: '9-02', intensidad: '3' },
                { nombre: 'Ciencias Naturales', grado_curso: '9-03', intensidad: '3' },
                { nombre: 'Historia y Geografía', grado_curso: '9-04', intensidad: '2' },
                { nombre: 'Inglés', grado_curso: '9-05', intensidad: '2' },
                { nombre: 'Educación Artística', grado_curso: '9-06', intensidad: '1' },
            ];
            defaults.forEach(d => {
                subjects.push({ id: ++subjectCounter, nombre: d.nombre, grado_curso: d.grado_curso, intensidad: d.intensidad });
            });
            renderSubjectsTable();
            updatePreview();
            showToast('✓ Datos de ejemplo cargados', 'success');
        }

        function resetForm() {
            if (!confirm('¿Seguro que quieres limpiar todos los datos?')) return;
            document.getElementById('docente').value = '';
            document.getElementById('titular').value = '';
            document.getElementById('tipo_docente').value = '';
            subjects = [];
            subjectCounter = 0;
            addSubject(); addSubject(); addSubject();
            updatePreview();
            showToast('Formulario limpiado', 'success');
        }

        async function imprimirBoletin() {
            const data = getFormData();
            
            if (!data.docente.trim()) {
                showToast('⚠ Por favor ingresa el nombre del docente', 'warning');
                return;
            }
            
            if (data.asignaturas.length === 0 || data.asignaturas.every(a => !a.nombre.trim())) {
                showToast('⚠ Añade al menos una asignatura con nombre', 'warning');
                return;
            }

            // Enviar al servidor para generar el PDF
            try {
                const response = await fetch('/imprimir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    showToast('⚠ Error al generar el documento', 'warning');
                    return;
                }

                const html = await response.text();
                const w = window.open('', '_blank');
                if (!w) {
                    showToast('⚠ Permite las ventanas emergentes para imprimir', 'warning');
                    return;
                }
                w.document.open();
                w.document.write(html);
                w.document.close();
                setTimeout(() => { w.print(); }, 800);
            } catch (error) {
                showToast('⚠ Error de conexión', 'warning');
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        init();
    </script>

</body>
</html>
